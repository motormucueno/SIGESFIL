{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Empresas</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            background-color: #2b2b2b;
            color: #a9b7c6;
            font-family: "JetBrains Mono", Consolas, monospace;
        }

        h5 {
            color: #ffffff;
            border-bottom: 1px solid #3c3f41;
            padding-bottom: 6px;
        }

        /* ===== LAYOUT IDE ===== */
        .ide-container {
    display: grid;
    grid-template-columns: 2.8fr 1.2fr 1.2fr;
    gap: 10px;
    height: 85vh;
}

        .ide-panel {
            background-color: #3c3f41;
            border: 1px solid #4e5254;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
        }

        /* ===== LISTA ===== */
        .list-item {
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .list-item:hover {
            background-color: #2f3133;
        }

        .list-item.active {
            background-color: #4b6eaf;
            color: white;
        }

        /* ===== SCROLL ===== */
        .ide-panel::-webkit-scrollbar {
            width: 8px;
        }

        .ide-panel::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .badge {
            background-color: #6a8759;
        }

        .text-muted {
            color: #777 !important;
        }
    </style>
</head>
<body>

<div class="container-fluid mt-3">

    <div class="ide-container">

        <!-- ================= EMPRESAS ================= -->
        <div class="ide-panel">
            <h5>🏢 Empresas</h5>

            {% for empresa in empresas %}
                <div class="list-item empresa-item"
                     data-empresa="{{ empresa.id }}">
                    {{ empresa.nome }}
                    <br>
                    <small class="text-muted">NIF: {{ empresa.nif }}</small>
                </div>
            {% empty %}
                <p class="text-muted">Nenhuma empresa cadastrada.</p>
            {% endfor %}
        </div>

        <!-- ================= TRABALHADORES ================= -->
        <div class="ide-panel">
            <h5>👥 Trabalhadores</h5>

            <div id="trabalhadores-panel" class="text-muted">
                Selecione uma empresa
            </div>
        </div>

        <!-- ================= CONTRAORDENAÇÕES ================= -->
        <div class="ide-panel">
            <h5>⚠️ Contraordenações</h5>

            <div id="contraordenacoes-panel" class="text-muted">
                Selecione uma empresa
            </div>
        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    $('.empresa-item').on('click', function () {

        $('.empresa-item').removeClass('active');
        $(this).addClass('active');

        let empresaId = $(this).data('empresa');

        // TRABALHADORES
        $('#trabalhadores-panel').html('A carregar...');
        $('#trabalhadores-panel').load(
            `/empresas/${empresaId}/trabalhadores/`
        );

        // CONTRAORDENAÇÕES
        $('#contraordenacoes-panel').html('A carregar...');
        $('#contraordenacoes-panel').load(
            `/empresas/${empresaId}/contraordenacoes/`
        );
    });
</script>

</body>
</html>
