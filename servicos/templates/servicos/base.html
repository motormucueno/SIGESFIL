{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <!-- IMPORTANTE PARA MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>{% block title %}Sistema Laboral{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a1f44, #08162e);
            min-height: 100vh;
            color: #fff;
            font-size: 16px;
        }

        .navbar {
            background-color: #08162e;
        }

        .content-wrapper {
            padding-top: 70px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .btn-custom {
            background-color: #0a58ca;
            border: none;
            font-size: 1rem;
            padding: 10px;
        }

        .btn-custom:hover {
            background-color: #084298;
        }

        input,
        select,
        textarea {
            font-size: 1rem;
            padding: 10px;
        }

        footer {
            background-color: #08162e;
            text-align: center;
            padding: 15px 10px;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #aaa;
        }

        @media (min-width: 768px) {
            body {
                font-size: 17px;
            }

            .content-wrapper {
                padding-top: 80px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR FIXA -->
<nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'home' %}">

            <!-- Ícone Livro -->
            <i class="bi bi-book-fill text-info"></i>

            <!-- Ícone Calculadora -->
            <i class="bi bi-calculator-fill text-warning"></i>

            Laboral +
        </a>
    </div>
</nav>

<!-- CONTEÚDO -->
<div class="container-fluid content-wrapper px-3 px-md-4">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER (NÃO ALTERADO) -->
<footer>
    Laboral + • Desenvolvido pelo Inspector Mucueno
</footer>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
