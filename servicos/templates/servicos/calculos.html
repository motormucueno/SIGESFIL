{% extends 'servicos/base.html' %}
{% block title %}Cálculos{% endblock %}

{% block content %}

<!-- BREADCRUMB -->
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb bg-transparent px-0">
        <li class="breadcrumb-item">
            <a href="{% url 'home' %}" class="text-info text-decoration-none">
                <i class="bi bi-house-door"></i> Início
            </a>
        </li>
        <li class="breadcrumb-item active text-light" aria-current="page">
            Cálculos
        </li>
    </ol>
</nav>

<!-- TÍTULO -->
<h2 class="mb-4 fw-bold text-center text-md-start">
    <i class="bi bi-calculator"></i> Cálculos Laborais
</h2>

<!-- CARDS -->
<div class="row g-4">

    <!-- SALÁRIO MÉDIO -->
    <div class="col-12 col-md-4">
        <div class="card text-dark p-4 h-100">
            <h5 class="fw-bold mb-3 text-center">Salário Médio Mensal da Empresa</h5>

            <input type="number"
                   id="total"
                   class="form-control form-control-lg mb-3"
                   placeholder="Total de salários (AKZ)"
                   step="0.01"
                   min="0">

            <input type="number"
                   id="num"
                   class="form-control form-control-lg mb-3"
                   placeholder="Número de trabalhadores"
                   min="1">

            <button type="button"
                    class="btn btn-custom btn-lg text-white w-100"
                    onclick="salario()">
                Calcular
            </button>

            <div id="r1" class="mt-3 fw-bold text-center"></div>
        </div>
    </div>

    <!-- SUBSÍDIO DE FÉRIAS -->
    <div class="col-12 col-md-4">
        <div class="card text-dark p-4 h-100">
            <h5 class="fw-bold mb-3 text-center">Subsídio de Férias</h5>

            <input type="number"
                   id="salario_base_ferias"
                   class="form-control form-control-lg mb-3"
                   placeholder="Salário base mensal (AKZ)"
                   step="0.01"
                   min="0">

            <button type="button"
                    class="btn btn-custom btn-lg text-white w-100"
                    onclick="subsidioFerias()">
                Calcular
            </button>

            <div id="r2" class="mt-3 fw-bold text-center"></div>
        </div>
    </div>

    <!-- SUBSÍDIO DE NATAL -->
    <div class="col-12 col-md-4">
        <div class="card text-dark p-4 h-100">
            <h5 class="fw-bold mb-3 text-center">Subsídio de Natal</h5>

            <input type="number"
                   id="salario_base_natal"
                   class="form-control form-control-lg mb-3"
                   placeholder="Salário base mensal (AKZ)"
                   step="0.01"
                   min="0">

            <button type="button"
                    class="btn btn-custom btn-lg text-white w-100"
                    onclick="subsidioNatal()">
                Calcular
            </button>

            <div id="r3" class="mt-3 fw-bold text-center"></div>
        </div>
    </div>

</div>

<!-- JAVASCRIPT -->
<script>
function formatarAKZ(valor) {
    return new Intl.NumberFormat('pt-PT', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }).format(valor) + " AKZ";
}

function salario() {
    let totalVal = parseFloat(total.value);
    let numVal = parseInt(num.value);

    if (isNaN(totalVal) || isNaN(numVal) || numVal <= 0) {
        alert("Preencha corretamente os campos.");
        return;
    }

    let resultado = totalVal / numVal;
    r1.innerText = "Resultado: " + formatarAKZ(resultado);
}

function subsidioFerias() {
    let baseVal = parseFloat(salario_base_ferias.value);

    if (isNaN(baseVal) || baseVal <= 0) {
        alert("Preencha corretamente o salário base.");
        return;
    }

    let resultado = baseVal * 0.5;
    r2.innerText = "Resultado: " + formatarAKZ(resultado);
}

function subsidioNatal() {
    let baseVal = parseFloat(salario_base_natal.value);

    if (isNaN(baseVal) || baseVal <= 0) {
        alert("Preencha corretamente o salário base.");
        return;
    }

    let resultado = baseVal * 0.5;
    r3.innerText = "Resultado: " + formatarAKZ(resultado);
}
</script>

{% endblock %}
